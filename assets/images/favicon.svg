<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#fav-grad)"/>
  <!-- Clapper / Film Cut Accent -->
  <path d="M12 24 L52 24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  <!-- Play Triangle with Soft Shadow -->
  <polygon points="26,18 26,46 48,32" fill="#ffffff" filter="url(#fav-glow)"/>
</svg>

