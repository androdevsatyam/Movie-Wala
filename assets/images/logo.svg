<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
  <defs>
    <linearGradient id="logo-icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="text-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(4, 4)">
    <rect width="56" height="56" rx="14" fill="url(#logo-icon-grad)" filter="url(#logo-glow)"/>
    <!-- Clapper Grid Lines -->
    <path d="M12 18 L44 18" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    <polygon points="23,20 23,44 41,32" fill="#ffffff"/>
  </g>

  <!-- Brand Typography -->
  <text x="74" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5">Movie<tspan fill="url(#text-accent-grad)">Wala</tspan></text>
  <text x="75" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1.5">HD VIDEO PLAYER</text>
</svg>
