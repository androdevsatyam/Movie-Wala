<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="placeholder-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="50%" stop-color="#131e35"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <radialGradient id="glow-center" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base & Glow -->
  <rect width="640" height="360" fill="url(#placeholder-bg)"/>
  <rect width="640" height="360" fill="url(#glow-center)"/>

  <!-- Subtle Grid Accent Lines -->
  <line x1="40" y1="0" x2="40" y2="360" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
  <line x1="600" y1="0" x2="600" y2="360" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
  <line x1="0" y1="300" x2="640" y2="300" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 8" opacity="0.3"/>

  <!-- Large Central Play / Movie Icon Badge -->
  <g transform="translate(320, 140)" filter="url(#shadow-filter)">
    <circle cx="0" cy="0" r="46" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="0" cy="0" r="38" fill="linear-gradient(135deg, #6366f1, #8b5cf6)"/>
    <polygon points="-8,-16 -8,16 16,0" fill="#ffffff"/>
  </g>

  <!-- Text & Prompts -->
  <text x="320" y="225" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Ready to Stream</text>
  <text x="320" y="252" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" text-anchor="middle">Select any video from the slider or catalog to start watching</text>

  <!-- Bottom Badge -->
  <g transform="translate(260, 275)">
    <rect width="120" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="60" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">HD STREAMING</text>
  </g>
</svg>
