<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="neon-pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#cyber-bg)"/>

  <!-- City Grid Lines / Perspective -->
  <line x1="0" y1="260" x2="640" y2="260" stroke="#ec4899" stroke-width="1.5" opacity="0.6"/>
  <line x1="0" y1="280" x2="640" y2="280" stroke="#06b6d4" stroke-width="1.5" opacity="0.6"/>
  <line x1="0" y1="310" x2="640" y2="310" stroke="#ec4899" stroke-width="2" opacity="0.7"/>
  <line x1="0" y1="350" x2="640" y2="350" stroke="#06b6d4" stroke-width="2.5" opacity="0.8"/>

  <!-- Vanishing Perspective Lines -->
  <line x1="320" y1="220" x2="0" y2="360" stroke="#06b6d4" stroke-width="1.5" opacity="0.5"/>
  <line x1="320" y1="220" x2="160" y2="360" stroke="#06b6d4" stroke-width="1.5" opacity="0.5"/>
  <line x1="320" y1="220" x2="480" y2="360" stroke="#06b6d4" stroke-width="1.5" opacity="0.5"/>
  <line x1="320" y1="220" x2="640" y2="360" stroke="#06b6d4" stroke-width="1.5" opacity="0.5"/>

  <!-- Skyline Buildings -->
  <rect x="80" y="100" width="60" height="150" fill="#1e1b4b" stroke="#ec4899" stroke-width="1.5"/>
  <rect x="160" y="60" width="80" height="190" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
  <rect x="260" y="120" width="50" height="130" fill="#1e1b4b" stroke="#f43f5e" stroke-width="1"/>
  <rect x="340" y="80" width="90" height="170" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="450" y="110" width="70" height="140" fill="#1e1b4b" stroke="#ec4899" stroke-width="1.5"/>
  <rect x="540" y="70" width="60" height="180" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>

  <!-- Glowing Sun / Circle -->
  <circle cx="320" cy="180" r="45" fill="none" stroke="url(#neon-pink)" stroke-width="4" opacity="0.9"/>

  <!-- Overlay Elements -->
  <rect x="24" y="24" width="76" height="24" rx="4" fill="#06b6d4" fill-opacity="0.3" stroke="#06b6d4" stroke-width="1"/>
  <text x="62" y="40" fill="#cffafe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">NEON</text>

  <rect x="548" y="316" width="68" height="24" rx="4" fill="#000000" fill-opacity="0.7"/>
  <text x="582" y="332" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">32:00</text>

  <text x="24" y="310" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Neon Nightdrive</text>
  <text x="24" y="332" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Cyberpunk Metropolis</text>
</svg>

