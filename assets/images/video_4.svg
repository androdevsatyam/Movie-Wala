<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="ocean-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <radialGradient id="light-ray" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#ocean-bg)"/>
  <polygon points="200,0 260,0 340,360 260,360" fill="#e0f2fe" opacity="0.15"/>
  <polygon points="320,0 400,0 490,360 390,360" fill="#e0f2fe" opacity="0.2"/>
  <polygon points="450,0 520,0 600,360 510,360" fill="#e0f2fe" opacity="0.12"/>

  <!-- Coral silhouettes -->
  <path d="M 0,360 Q 60,260 120,360 Q 180,240 240,360" fill="#0c4a6e" opacity="0.9"/>
  <path d="M 220,360 Q 300,280 380,360 Q 460,220 540,360 Q 600,290 640,360" fill="#082f49" opacity="0.95"/>

  <!-- Marine life silhouettes -->
  <path d="M 280,140 Q 310,135 340,140 Q 350,130 360,135 Q 355,145 340,148 Q 310,150 280,140 Z" fill="#38bdf8" opacity="0.8"/>
  <path d="M 160,100 Q 180,95 200,100 Q 207,92 215,96 Q 210,104 200,106 Q 180,108 160,100 Z" fill="#7dd3fc" opacity="0.7"/>

  <!-- Overlay Elements -->
  <rect x="24" y="24" width="76" height="24" rx="4" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1"/>
  <text x="62" y="40" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">OCEAN</text>

  <rect x="548" y="316" width="68" height="24" rx="4" fill="#000000" fill-opacity="0.7"/>
  <text x="582" y="332" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">15:50</text>

  <text x="24" y="310" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Coral Reef Journey</text>
  <text x="24" y="332" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Ocean Wonders Series</text>
</svg>

