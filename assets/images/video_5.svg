<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="40%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#arch-bg)"/>

  <!-- Geometric Architectural Blocks -->
  <polygon points="120,60 280,120 280,360 120,300" fill="#d97706" opacity="0.6"/>
  <polygon points="280,120 440,40 440,280 280,360" fill="#b45309" opacity="0.8"/>
  <polygon points="120,60 280,120 440,40 280,0" fill="#fbbf24" opacity="0.4"/>
  <polygon points="440,40 560,100 560,340 440,280" fill="#92400e" opacity="0.7"/>

  <!-- Overlay Elements -->
  <rect x="24" y="24" width="76" height="24" rx="4" fill="#d97706" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1"/>
  <text x="62" y="40" fill="#fef3c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">DESIGN</text>

  <rect x="548" y="316" width="68" height="24" rx="4" fill="#000000" fill-opacity="0.7"/>
  <text x="582" y="332" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">21:05</text>

  <text x="24" y="310" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Urban Landscapes</text>
  <text x="24" y="332" fill="#fcd34d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Modern Architecture</text>
</svg>

