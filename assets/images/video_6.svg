<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="mountain-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#mountain-bg)"/>

  <!-- Mountain Peak 1 -->
  <polygon points="60,360 220,120 380,360" fill="#3730a3"/>
  <polygon points="220,120 180,180 220,200 250,160" fill="#e0e7ff" opacity="0.9"/>

  <!-- Mountain Peak 2 (Main) -->
  <polygon points="180,360 360,70 540,360" fill="#1e1b4b"/>
  <polygon points="360,70 310,140 360,165 400,125" fill="#ffffff" opacity="0.95"/>
  <polygon points="360,70 400,125 540,360 360,360" fill="#312e81" opacity="0.5"/>

  <!-- Mountain Peak 3 -->
  <polygon points="380,360 520,150 640,360" fill="#3730a3"/>
  <polygon points="520,150 490,190 520,210 545,180" fill="#e0e7ff" opacity="0.8"/>

  <!-- Overlay Elements -->
  <rect x="24" y="24" width="76" height="24" rx="4" fill="#4f46e5" fill-opacity="0.4" stroke="#818cf8" stroke-width="1"/>
  <text x="62" y="40" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TREK</text>

  <rect x="548" y="316" width="68" height="24" rx="4" fill="#000000" fill-opacity="0.7"/>
  <text x="582" y="332" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">29:40</text>

  <text x="24" y="310" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Himalayan Expedition</text>
  <text x="24" y="332" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Mountain Peaks Series</text>
</svg>

